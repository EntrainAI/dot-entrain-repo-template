description: >-
  Changes to the organization's and projects' gates, attributes, their format version and classifiers need
  a person
action: merge
scope: fileChange
match: |-
  sides.exists(path.globMatch([
    'attributes/**',
    'classifiers/**',
    'gates/**',
    'projects/*/attributes/**',
    'projects/*/gates/**',
    'projects/*/spec.yaml',
    'spec.yaml',
  ]))
requirements:
  reviews:
    - reviewers: [pr.author, people]
      dismiss: on-push
