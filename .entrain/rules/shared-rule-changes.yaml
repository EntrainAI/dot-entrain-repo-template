description: Changes to the organization's and projects' rules, attributes, their format version and classifiers need a person
action: merge
scope: file
match: |-
  paths.exists(globMatch([
    'attributes/**',
    'classifiers/**',
    'gates/**',
    'projects/*/attributes/**',
    'projects/*/gates/**',
    'projects/*/rules/**',
    'projects/*/spec.yaml',
    'rules/**',
    'spec.yaml',
  ]))
requirements:
  reviews:
    - reviewers: [pr.author, people]
      dismiss: on-push
