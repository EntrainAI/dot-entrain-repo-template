description: Changes to rules, attributes, their format version, gitattributes and code owners need a person
action: merge
scope: file
match: |-
  paths.exists(globMatch([
    '**/.gitattributes',
    '.entrain/attributes/**',
    '.entrain/gates/**',
    '.entrain/rules/**',
    '.entrain/spec.yaml',
    '.github/CODEOWNERS',
    'CODEOWNERS',
    'docs/CODEOWNERS',
  ]))
requirements:
  reviews:
    - reviewers: [pr.author, people]
      dismiss: on-push
locked: true
