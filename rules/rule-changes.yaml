description: Changes to rules, attributes, gitattributes and code owners need a person
when: >-
  path.glob(['rules/**', 'attributes/**', 'projects/*/rules/**', 'projects/*/attributes/**',
  '.entrain/rules/**', '.entrain/attributes/**',
  '**/.gitattributes', 'CODEOWNERS', '.github/CODEOWNERS', 'docs/CODEOWNERS'])
locked: true
requires:
  - people: [pr.author, members]
    dismiss: on-push
