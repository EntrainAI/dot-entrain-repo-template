description: >-
  Changes to gates, attributes and their format version need a person
action: merge
scope: fileChange
match: |-
  sides.exists(path.globMatch([
    '.entrain/attributes/**',
    '.entrain/gates/**',
    '.entrain/spec.yaml',
  ]))
requirements:
  reviews:
    - reviewers: [principal(pr.author), people]
      dismiss: on-push
locked: true
